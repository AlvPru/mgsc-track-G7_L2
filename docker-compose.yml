version: '3.9'

services:
  mgsc:
    build:
      context: .
      dockerfile: Dockerfile
    image: mgsc:latest
    ports:
      - '8080:8080'
    environment:
      SPRING_PROFILES_ACTIVE: jpa
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
