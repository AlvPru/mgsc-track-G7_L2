name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release on tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=AlvPru_mgsc-track-G7_L2 \
            -Dsonar.organization=alvpru \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Find built JAR
        id: find_jar
        run: |
          JAR_FILE=$(find target -maxdepth 1 -name '*.jar' ! -name '*original.jar' | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "No JAR found in target directory" >&2
            exit 1
          fi
          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR asset to release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.JAR_FILE }}
          asset_name: ${{ github.ref_name }}.jar
          asset_content_type: application/java-archive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mgcss-track:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/mgcss-track:latest
