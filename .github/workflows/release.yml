name: Release

permissions:
  contents: write
  packages: read

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release on tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Set up Java 17
        uses: actions/setup-java@99b86d3c134d58df5d79d8f1d697a65d3424d6f1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Build, test and analyze (SonarCloud)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=AlvPru_mgsc-track-G7_L2 \
            -Dsonar.organization=alvpru \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Find built JAR
        id: find_jar
        run: |
          JAR_FILE=$(find target -maxdepth 1 -name '*.jar' ! -name '*original.jar' | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "No JAR found in target directory" >&2
            exit 1
          fi
          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV

      - name: Create GitHub Release and Upload JAR
        uses: softprops/action-gh-release@c95fe1489396fe8a2169b0a2d4ad22a498bd6502
        with:
          files: "${{ env.JAR_FILE }}"
          name: Release ${{ github.ref_name }}
          body_path: docs/release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d70b336265683a22957aa0273719e58a25a6c2bc

      - name: Login to Docker Hub
        uses: docker/login-action@0d4c94def6ee310064d124bef8316e6d156828c4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mgcss-track:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/mgcss-track:latest